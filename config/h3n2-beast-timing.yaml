# BEAST 2 runtime and convergence for the H3N2 analysis.
#
# These numbers were recorded in the computing environment the analysis was
# originally run in; the benchmark file and MCMC log they were derived from are
# not reproduced by the current workflow (rule beast in workflow/data.smk would
# need a BEAST 2 run of 30 million states, which takes over six hours). They are
# recorded here so the timing comparison in the manuscript can be rebuilt
# without re-running BEAST.
#
# The TreeFlow side of the comparison IS recomputed, from the multi-run
# variational campaign (rule flu_timing_data), and therefore reflects the
# machine the variational analyses were last run on rather than the original
# environment. The two sides are consequently not measured on the same hardware
# -- see the Scalable inference section of the manuscript, which states this.
iterations: 30000000
min_ess: 103.28293883597895
runtime_seconds: 22898.83
